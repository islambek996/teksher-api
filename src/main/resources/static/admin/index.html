<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Teksher Scanner Admin</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            margin:40px;
        }
        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }
        th,td{
            border:1px solid #ddd;
            padding:10px;
        }
        th{
            background:#1565C0;
            color:white;
        }
        button{
            padding:6px 12px;
            cursor:pointer;
        }
        h1{
            color:#1565C0;
        }
    </style>

</head>
<body>

<h1>Teksher Scanner Admin</h1>

<button onclick="loadScans()">Обновить</button>

<table>

    <thead>
    <tr>
        <th>ID</th>
        <th>Код маркировки</th>
    </tr>
    </thead>

    <tbody id="tableBody">

    </tbody>

</table>

<script>

    async function loadScans(){

        const response=await fetch("/api/scans");

        const scans=await response.json();

        let html="";

        scans.forEach(scan=>{

            html+=`
        <tr>
            <td>${scan.id}</td>
            <td>${scan.code}</td>
        </tr>
        `;

        });

        document.getElementById("tableBody").innerHTML=html;

    }

    loadScans();

</script>

</body>
</html>
