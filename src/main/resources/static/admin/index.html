<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Teksher Scanner Admin</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:40px;
        }

        .header{
            background:#1565C0;
            color:white;
            padding:25px;
            border-radius:10px;
            margin-bottom:20px;
        }

        h1{
            margin:0;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            margin-top:20px;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
            text-align:left;
            vertical-align:top;
        }

        th{
            background:#1565C0;
            color:white;
        }

        button{
            background:#1565C0;
            color:white;
            border:none;
            padding:10px 18px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0D47A1;
        }

        input{
            width:400px;
            padding:10px;
            font-size:16px;
        }

        td:nth-child(3){
            word-break:break-all;
            max-width:550px;
        }

    </style>

</head>

<body>

<div class="header">
    <h1>📷 Teksher Scanner</h1>
    <p>Панель администратора</p>
</div>

<h3>
    Всего сканов:
    <span id="count">0</span>
</h3>

<div style="margin-bottom:20px;">

    <input
            type="text"
            id="search"
            placeholder="Поиск..."
            onkeyup="filterTable()">

    <button onclick="loadScans()">
        Обновить
    </button>

    <button onclick="deleteAll()">
        Очистить всё
    </button>

    <button onclick="exportCsv()">
        📥 Экспорт CSV
    </button>

</div>

<table>

    <thead>

    <tr>
        <th>GTIN</th>
        <th>Серийный номер</th>
        <th>Код</th>
        <th>Удалить</th>
    </tr>

    </thead>

    <tbody id="tableBody">

    </tbody>

</table>

<script>
    console.log(scan.code);
    console.log(scan.code.split(String.fromCharCode(29)));
    function parseCode(code) {

        const GS = String.fromCharCode(29);

        let gtin = "";
        let serial = "";
        let crypto = "";

        if (code.startsWith("01")) {
            gtin = code.substring(2, 16);
        }

        const serialStart = code.indexOf("21");

        if (serialStart !== -1) {

            const start = serialStart + 2;
            const end = code.indexOf(GS, start);

            if (end !== -1) {

                serial = code.substring(start, end);

                const cryptoStart = code.indexOf("92", end);

                if (cryptoStart !== -1) {
                    crypto = code.substring(cryptoStart + 2);
                }
            }
        }

        return {
            gtin,
            serial,
            crypto
        };
    }

    function exportCsv() {
        window.location.href = "/api/scans/export";
    }

    async function loadScans() {

        const response = await fetch("/api/scans");

        const scans = await response.json();

        document.getElementById("count").innerText = scans.length;

        let html = "";

        scans.forEach(scan => {

            const parsed = parseCode(scan.code);

            html += `
        <tr>
            <td>${parsed.gtin}</td>
            <td>${parsed.serial}</td>
            <td style="word-break:break-all">${parsed.crypto}</td>
            <td>
                <button onclick="deleteScan(${scan.id})">
                    🗑 Удалить
                </button>
            </td>
        </tr>
        `;

        });

        document.getElementById("tableBody").innerHTML = html;
    }

    async function deleteScan(id){

        if(!confirm("Удалить запись?"))
            return;

        await fetch("/api/scans/" + id,{
            method:"DELETE"
        });

        loadScans();
    }

    async function deleteAll(){

        if(!confirm("Удалить все записи?"))
            return;

        await fetch("/api/scans",{
            method:"DELETE"
        });

        loadScans();
    }

    function filterTable(){

        const value = document
            .getElementById("search")
            .value
            .toLowerCase();

        const rows = document.querySelectorAll("#tableBody tr");

        rows.forEach(row=>{

            if(row.innerText.toLowerCase().includes(value)){
                row.style.display="";
            }else{
                row.style.display="none";
            }

        });

    }

    loadScans();
</script>
</body>
</html>
